[env:esp32s3]
; Pinned. Unpinned, this resolves to espressif32 53.x / Arduino core 3.x, where
; ledcSetup+ledcAttachPin are replaced by ledcAttach and Arduino_GFX renames
; Arduino_ESP32RGBPanel — the build fails outright. Moving to core 3.x is a
; deliberate port, not something a fresh clone should be surprised by.
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitm-1

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
upload_port = /dev/cu.usbserial-1420
monitor_port = /dev/cu.usbserial-1420

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    kikuchan98/pngle@^1.1.0
    tamctec/TAMC_GT911@^1.0.2
    lvgl/lvgl@^8.4.0
    bblanchon/ArduinoJson@^7.0.0
    Wire
